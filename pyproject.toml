[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-quality-pipeline"
version = "0.2.0"
description = "A reproducible pipeline for collecting, rendering, reviewing, and reporting presentation quality."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PPT Quality Pipeline contributors" }]
keywords = ["powerpoint", "quality-assurance", "playwright", "evaluation", "annotation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=0.6.23"]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pqp = "ppt_quality_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppt_quality_pipeline = ["backends/*", "browser/*", "web/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
