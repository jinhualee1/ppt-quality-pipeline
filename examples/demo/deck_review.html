<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>季度简报演示</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; display: grid; gap: 40px; background: #dfe5e8; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; color: #17212b; }
      [data-slide] { width: 1280px; height: 720px; position: relative; overflow: hidden; padding: 58px 68px; background: #ffffff; }
      .eyebrow { color: #b45143; font-size: 16px; font-weight: 800; text-transform: uppercase; }
      h1 { width: 800px; margin: 90px 0 18px; font-size: 66px; line-height: 1.08; }
      .lead { width: 700px; color: #61707a; font-size: 27px; line-height: 1.45; }
      .bars { position: absolute; right: 80px; bottom: 70px; width: 340px; height: 430px; display: flex; align-items: end; gap: 28px; border-bottom: 3px solid #17212b; }
      .bar { flex: 1; background: #0a938b; }
      .bar:nth-child(1) { height: 42%; background: #e9b44c; }
      .bar:nth-child(2) { height: 68%; background: #ee765d; }
      .bar:nth-child(3) { height: 84%; }
      .page { position: absolute; right: 68px; top: 58px; color: #7e8992; }
      h2 { margin: 38px 0 10px; font-size: 46px; }
      .sub { margin: 0; color: #697680; font-size: 21px; }
      .scoreboard { display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; margin-top: 62px; }
      .score { padding: 32px; background: #17212b; color: #ffffff; }
      .score strong { display: block; color: #81d8cb; font-size: 68px; }
      .score span { font-size: 20px; }
      .notes { display: grid; gap: 18px; }
      .note { padding: 20px 22px; border-left: 5px solid #e9b44c; background: #f4f6f7; }
      .note:nth-child(2) { border-color: #ee765d; }
      .note h3 { margin: 0 0 7px; font-size: 21px; }
      .note p { margin: 0; color: #62707a; font-size: 17px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <section data-slide>
      <span class="eyebrow">季度简报</span><span class="page">01</span>
      <h1>采用率从试用走向常态</h1>
      <p class="lead">随着审阅团队统一演示文稿证据采集流程，重复使用率持续提升。</p>
      <div class="bars" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    </section>
    <section data-slide>
      <span class="eyebrow">运行信号</span><span class="page">02</span>
      <h2>稳定性正在持续改善</h2>
      <p class="sub">本合成演示稿故意缺少最后一页交付内容，用于展示自动问题识别。</p>
      <div class="scoreboard">
        <div class="score"><strong>96.4%</strong><span>渲染任务成功完成</span></div>
        <div class="notes">
          <article class="note"><h3>稳定重试</h3><p>浏览器瞬时失败不会影响已经完成的产物。</p></article>
          <article class="note"><h3>缺口可见</h3><p>缺失要求会转化为明确的人工复核问题。</p></article>
        </div>
      </div>
    </section>
  </body>
</html>
