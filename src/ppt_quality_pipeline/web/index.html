<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPT Quality Review</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">PQ</span>
        <div>
          <strong>PPT Quality Review</strong>
          <span id="run-summary">Loading run</span>
        </div>
      </div>
      <div class="top-actions">
        <span id="save-state" class="save-state">Saved</span>
        <button id="save" class="primary-action" type="button">
          <span class="wide-label">Save review</span>
          <span class="compact-label">Save</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="item-panel" aria-label="Evaluation items">
        <div class="panel-heading">
          <span>Items</span>
          <span id="item-count" class="count"></span>
        </div>
        <nav id="item-list" class="item-list"></nav>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <button id="previous" class="icon-button" type="button" title="Previous slide" aria-label="Previous slide">‹</button>
          <div class="slide-identity">
            <strong id="slide-title">Slide</strong>
            <span id="slide-position"></span>
          </div>
          <button id="next" class="icon-button" type="button" title="Next slide" aria-label="Next slide">›</button>
          <button id="fit" class="icon-button" type="button" title="Fit slide" aria-label="Fit slide">⛶</button>
        </div>
        <div id="canvas" class="canvas">
          <img id="slide-image" alt="Rendered presentation slide">
          <div id="empty-state" class="empty-state" hidden>No rendered slide is available.</div>
        </div>
      </section>

      <aside class="review-panel" aria-label="Slide review">
        <div class="panel-heading">Review</div>
        <section class="status-block">
          <span class="field-label">Automated status</span>
          <div id="automated-status" class="automated-status"></div>
        </section>
        <fieldset class="issue-options">
          <legend>Visual finding</legend>
          <button type="button" data-label="overflow">Text overflow</button>
          <button type="button" data-label="overlap">Element overlap</button>
          <button type="button" data-label="blank">Blank or missing</button>
          <button type="button" data-label="other">Other issue</button>
          <button type="button" data-label="no_issue" class="no-issue">No issue</button>
        </fieldset>
        <label class="notes">
          <span>Notes</span>
          <textarea id="note" rows="6" placeholder="Optional evidence or context"></textarea>
        </label>
        <div class="query-block">
          <span class="field-label">User request</span>
          <p id="query"></p>
        </div>
      </aside>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
